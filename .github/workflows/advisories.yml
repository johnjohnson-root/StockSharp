name: Advisories

# Scans the pinned package graph for known security advisories
# and fails the run on any hit,
# so the repository owner gets a notification naming the package.
#
# The scan exists because pinning freezes a package at a version
# that will never take a patch:
# Directory.Build.targets holds every external id
# at its newest release before 2026-07-16,
# and the Ecng.* ids are published by the owner that relicensed upstream,
# so no fix is coming for any advisory filed against them.
# Watching is the whole mitigation while a pin remains.
#
# The response path for a hit against a pinned package:
# escalate that package's clean-room replacement immediately
# (decision record 0003, TODO items T2 and T3),
# because replacement is the only remedy a frozen package admits.
# A hit against an unpinned transitive package
# takes an ordinary version bump instead.
#
# Three solutions rather than one:
# StockSharp_Tests.slnx misses the Localization.Langs satellites
# and the two Algo.Analytics script projects,
# and Ecng.Interop reaches the graph through a sample alone —
# the same gap the mirror script closed by covering the samples solution.

on:
  schedule:
    # Mondays, early. GitHub runs a schedule from the default branch alone,
    # so this fires from master and never from a topic branch.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    # Re-scan whenever the pin graph or the scanner itself changes,
    # which is also what proves the workflow green before it merges.
    paths:
      - 'Directory.Build.targets'
      - 'common_versions.props'
      - '.github/workflows/advisories.yml'

permissions:
  contents: read

jobs:
  vulnerable:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.302 is the version global.json pins; keeping the two in
          # step means the runner installs exactly the SDK the build asks for.
          dotnet-version: |
            6.0.x
            10.0.302

      - name: Scan the pinned graph
        shell: bash
        run: |
          set -uo pipefail

          # dotnet list package --vulnerable exits 0 whether or not it finds
          # anything, and reports per project: "has the following vulnerable
          # packages" against "has no vulnerable packages given the current
          # sources". The exit status therefore comes from the report text.
          status=0

          for sln in StockSharp.slnx StockSharp_Tests.slnx StockSharp_Samples.slnx; do
            echo "::group::$sln"

            if ! dotnet restore "$sln"; then
              echo "::error::restore failed for $sln, so the scan covered nothing"
              echo "::endgroup::"
              status=1
              continue
            fi

            report=$(dotnet list "$sln" package --vulnerable --include-transitive 2>&1)
            rc=$?
            echo "$report"
            echo "::endgroup::"

            if [ $rc -ne 0 ]; then
              echo "::error::dotnet list package failed for $sln (exit $rc)"
              status=1
              continue
            fi

            if grep -q 'has the following vulnerable packages' <<<"$report"; then
              echo "::error::$sln depends on a package carrying a known advisory — see the $sln group above for the package, severity, and advisory URL"
              status=1
            fi
          done

          exit $status
