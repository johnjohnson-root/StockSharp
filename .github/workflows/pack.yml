name: Pack

# Builds the fork-branded NuGet packages
# (StockShark.* by default, see common_packaging.props)
# and uploads them as a CI artifact.
# Publishing to a feed stays a deliberate, manual step:
# download the artifact and push it with `dotnet nuget push`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (ForkPackageVersion)
        required: false
        default: ""

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.302 is the version global.json pins; keeping the two in
          # step means the runner installs exactly the SDK the build asks for.
          dotnet-version: |
            6.0.x
            10.0.302

      - name: Pack
        # The input reaches the script through env,
        # so the shell reads a crafted "version" value as data alone.
        env:
          FORK_PACKAGE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$FORK_PACKAGE_VERSION" ]; then
            export PACK_ARGS="-p:ForkPackageVersion=$FORK_PACKAGE_VERSION"
          fi
          ./tools/pack.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/nupkgs/*.nupkg
          if-no-files-found: error
