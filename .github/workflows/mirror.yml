name: Mirror packages

# Produces a self-contained NuGet folder feed
# carrying the exact package closure both solutions build against
# (see tools/mirror-packages.sh and NuGet.config).
# Run it manually and stash the artifact somewhere durable:
# it is the recovery path
# wherever a pinned upstream package (Ecng.*, HistoryData, ...)
# goes unpublished or delisted.

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.302 is the version global.json pins; keeping the two in
          # step means the runner installs exactly the SDK the build asks for.
          dotnet-version: |
            6.0.x
            10.0.302

      - name: Build mirror
        run: ./tools/mirror-packages.sh

      - name: Verify offline restore from mirror
        # --no-http-cache is defence in depth:
        # a folder feed restores from disk alone today,
        # and the flag keeps the "offline" claim honest
        # wherever a remote source reaches this restore later.
        run: |
          dotnet restore StockSharp_Tests.slnx --source ./nuget-mirror --no-http-cache --packages "$RUNNER_TEMP/verify-pkgs"
          dotnet restore StockSharp_Samples.slnx --source ./nuget-mirror --no-http-cache --packages "$RUNNER_TEMP/verify-pkgs"

      - name: Upload mirror artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-mirror
          path: nuget-mirror/*.nupkg
          if-no-files-found: error
