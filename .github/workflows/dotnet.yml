name: Build & Tests

# Standalone CI: everything builds from this repository alone — no sibling
# checkouts, no private repos, no folder-name requirements.

on:
  push:
    branches: [ master, standalone-build ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Build StockSharp.slnx
        run: dotnet build StockSharp.slnx --configuration Release

      - name: Build tests solution
        run: dotnet build StockSharp_Tests.slnx --configuration Release

      - name: Run tests
        run: dotnet test StockSharp_Tests.slnx --no-build --configuration Release
