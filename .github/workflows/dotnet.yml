name: Build & Tests

# Standalone CI: everything builds from this repository alone — no sibling
# checkouts, no private repos, no folder-name requirements.

on:
  push:
    branches: [ master, standalone-build ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Build StockSharp.slnx
        run: dotnet build StockSharp.slnx --configuration Release

      - name: Build tests solution
        run: dotnet build StockSharp_Tests.slnx --configuration Release

      - name: Run tests
        # --blame-hang names and kills any test that stalls instead of letting
        # it silently consume the whole job timeout. The Python analytics
        # tests are excluded as broken upstream — see KNOWN-ISSUES.md.
        # The suite carries a long tail of low-probability timing-sensitive
        # tests (KNOWN-ISSUES.md), so tests that fail get exactly one retry;
        # anything that fails twice fails the job.
        shell: bash
        run: |
          set -uo pipefail
          FILTER='FullyQualifiedName!~PythonAnalyticsScripts'
          run_tests() {
            dotnet test StockSharp_Tests.slnx --no-build --configuration Release \
              --blame-hang --blame-hang-timeout 8m \
              --logger "trx;LogFileName=$1.trx" --filter "$2"
          }
          if run_tests run1 "$FILTER"; then
            exit 0
          fi
          RETRY=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          NS = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          names = set()
          for f in glob.glob('**/TestResults/**/run1.trx', recursive=True) + glob.glob('**/TestResults/run1.trx', recursive=True):
              root = ET.parse(f).getroot()
              defs = {d.get('id'): d for d in root.iter(NS + 'UnitTest')}
              for res in root.iter(NS + 'UnitTestResult'):
                  if res.get('outcome') == 'Failed':
                      d = defs.get(res.get('testId'))
                      if d is None:
                          continue
                      tm = d.find(NS + 'TestMethod')
                      cls = tm.get('className').split(',')[0]
                      name = tm.get('name').split(' (')[0]
                      names.add(cls + '.' + name)
          print('|'.join('FullyQualifiedName~' + n for n in sorted(names)))
          PY
          )
          if [ -z "$RETRY" ]; then
            echo "Test run failed but no failed tests were parsed from trx (abort/hang?)."
            exit 1
          fi
          echo "Retrying once: $RETRY"
          run_tests run2 "($FILTER)&($RETRY)"

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testresults-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: ignore
