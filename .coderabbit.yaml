# Disables CodeRabbit automated reviews for this repository.
# CodeRabbit reads this file from the head branch of each pull request.
# This silences the bot alone.
# Uninstalling the GitHub App requires a repo or org admin
# (GitHub Settings -> GitHub Apps -> CodeRabbit, or the coderabbit.ai dashboard).
reviews:
  auto_review:
    enabled: false
  review_status: false
chat:
  auto_reply: false
